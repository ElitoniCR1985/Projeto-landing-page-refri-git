<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Slider de Refrigerantes</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="slider">

        <div class="item active" style="--background: #2d5643;">
            <div class="title">Abacate</div>

            <img src="./img/Abacate.png" class="fruit" alt="Abacate">

            <img src="./img/2.png" class="refri" alt="Refrigerante de Abacate">
        </div>

        <div class="item hidden" style="--background: #e7a043;">
            <div class="title">Laranja</div>

            <img src="./img/laranja.png" class="fruit" alt="Laranja">

            <img src="./img/3.png" class="refri" alt="Refrigerante de Laranja">
        </div>

        <div class="arrow">
            <button id="prev" aria-label="Item anterior">
                &lt;
            </button>

            <button id="next" aria-label="Próximo item">
                &gt;
            </button>
        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
